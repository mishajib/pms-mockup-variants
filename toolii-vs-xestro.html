 ['erx','eRx and NPDS',S.rx.length?w(S.rx,x=>x.st):'off',S.rx.length+' scripts, '+S.rx.filter(x=>x.st!=='ack').length+' not yet retrieved (simulated).','/pts'],

function admDetail(a,sec){const p=P(a.p),cv=can('clin.view'),cw=can('clin.write');

 const nav=`<nav class="csn" aria-label="Admission sections">${S1.map(([k,l])=>`<a href="#/adm/${a.id}/${k}" ${sec===k?'aria-current="page"':''}>${l}</a>`).join('')}</nav>`;
 const clinical=['current','antenatal','postnatal'].includes(sec),lock=clinical&&!cv;
 let b='';
 if(lock)b=restricted('Pregnancy clinical details');
 else if(sec==='current')b=pnl('xa-c','Key dates and risk factors',`<dl class="kv"><dt>Gestation</dt><dd>${a.wk} weeks (as last recorded)</dd><dt>Provider</dt><dd>${esc(DOCS[a.doc].n)}, ${a.loc}</dd><dt>Risk factors</dt><dd>${a.risk.length?a.risk.map(esc).join('; '):'None recorded'}</dd></dl><p class="hint">Entered by the clinician. PMS does not calculate or interpret risk.</p>`,'')+pnl('xa-s','Screening',`<ul class="mlist">${a.screen.map(s=>`<li><span>${esc(s[0])}</span>${chip(/review/i.test(s[1])?'warn':'neu',s[1])}</li>`).join('')||'<li class="muted">None recorded</li>'}</ul>`,'')
 else if(sec==='antenatal')b=pnl('xa-v','Antenatal visits',`<ul class="mlist">${a.visits.map(v=>`<li><span><b>${v.d}, ${v.by}</b>, ${v.wk} weeks<br><span class="muted">${esc(v.n)}</span></span></li>`).join('')||'<li class="muted">No visits yet.</li>'}</ul>${cw&&a.st==='open'?`<div class="row-actions"><button class="btn pri" type="button" data-act="xVisit" data-id="${a.id}">Add antenatal visit</button></div>`:''}`,a.visits.length+' visits')
 else if(sec==='postnatal')b=pnl('xa-p','Postnatal care',`<ul class="mlist">${a.post.map(v=>`<li><span><b>${v.d}, ${v.by}</b><br><span class="muted">${esc(v.n)}</span></span></li>`).join('')||'<li class="muted">None recorded.</li>'}</ul>${cw&&a.st==='open'?`<div class="row-actions"><button class="btn" type="button" data-act="xPost" data-id="${a.id}">Add postnatal visit</button></div>`:''}`,'')
 else if(sec==='booking')b=pnl('xa-b','Booking',`<dl class="kv"><dt>Procedure</dt><dd>${esc(a.proc)}</dd><dt>When</dt><dd>${dayFull(a.d)}, ${hm(a.t)}, ${a.room}</dd><dt>Funding</dt><dd>${a.fund}</dd><dt>Consent form</dt><dd>${a.consent?chip('ok','Signed (recorded)'):chip('warn','Not yet signed')}</dd><dt>Quote</dt><dd>${a.quote?(a.quote==='ack'?stChip('ack'):stChip('sent')):chip('neu','No quote yet')}</dd></dl><div class="row-actions"><a class="btn sm" href="#/quote">Quotes</a><a class="btn sm" href="#/lists">Theatre list</a></div>`,'')
 else if(sec==='documents')b=pnl('xa-d','Documents',`<ul class="mlist">${a.docs.map(d=>`<li><span>${esc(d)}</span><span class="muted">Saved locally</span></li>`).join('')||'<li class="muted">No documents yet.</li>'}</ul><div class="row-actions"><a class="btn" href="#/letters">Write a Quick Letter</a></div>`,'')
 else b=pnl('xa-i','Billing for this admission',(can('billing')||can('bill.view'))?invRows(S.inv.filter(i=>i.p===a.p)):'<p class="muted">Billing is not available to this role.</p>','');

 const ent=UI.xent||'all';
 const rowsF=S.inv.filter(i=>i.st!=='void'&&i.st!=='draft').map(i=>{const a=i.a&&AP(i.a);return{i,ty:a?a.ty:null,doc:a?a.doc:null}}).filter(r=>ent==='all'||r.doc===ent);
 const cen=CENTRES.map(([n,tys])=>{const L2=rowsF.filter(r=>tys.includes(r.ty));return[n,L2.reduce((s,r)=>s+inv$(r.i),0),L2.reduce((s,r)=>s+r.i.paid,0)]});
 let body='';
 if(t==='fin')body=pnl('xr-f','Revenue by centre, from invoices',`<div class="xlocs"><label class="fld"><span>Entity</span><select data-on="xrf" data-k="xent"><option value="all">All entities</option>${Object.keys(DOCS).map(k=>`<option value="${k}"${ent===k?' selected':''}>${ENT[k]}</option>`).join('')}</select></label></div><div class="scroll-x"><table class="tbl"><thead><tr><th>Revenue centre</th><th>Billed</th><th>Paid</th><th>Owing</th></tr></thead><tbody>${cen.map(c=>`<tr><td>${c[0]}</td><td class="num">${money(c[1])}</td><td class="num">${money(c[2])}</td><td class="num">${money(c[1]-c[2])}</td></tr>`).join('')}<tr><td><b>Total</b></td><td class="num"><b>${money(cen.reduce((s,c)=>s+c[1],0))}</b></td><td class="num"><b>${money(cen.reduce((s,c)=>s+c[2],0))}</b></td><td class="num"><b>${money(cen.reduce((s,c)=>s+c[1]-c[2],0))}</b></td></tr></tbody></table></div><p class="hint">Totals come from the invoices in this demo only. The Obstetrics centre is empty until package invoicing is built.</p><div class="row-actions"><button class="btn" type="button" data-act="toastC" data-m="Export for the accounting package is simulated. A real build writes a file.">Export for accounting package (simulated)</button></div>`,'')
 else if(t==='preg'){const kf=UI.xpk||'all',pf=UI.xpd||'all',tf=UI.xpt||'all';const L2=x.adm.filter(a=>a.kind==='preg'&&(kf==='all'||phase(a)===kf)&&(pf==='all'||a.doc===pf)&&(tf==='all'||a.age<=+tf));
  body=pnl('xr-p','Pregnancy audit',`<div class="xlocs"><label class="fld"><span>Admission type</span><select data-on="xrf" data-k="xpk"><option value="all">All</option><option value="antenatal"${kf==='antenatal'?' selected':''}>Antenatal</option><option value="postnatal"${kf==='postnatal'?' selected':''}>Postnatal</option></select></label><label class="fld"><span>Provider</span><select data-on="xrf" data-k="xpd"><option value="all">All</option>${Object.keys(DOCS).map(k=>`<option value="${k}"${pf===k?' selected':''}>${DOCS[k].n}</option>`).join('')}</select></label><label class="fld"><span>Time frame</span><select data-on="xrf" data-k="xpt"><option value="all">All time</option><option value="90"${tf==='90'?' selected':''}>Last 90 days</option><option value="365"${tf==='365'?' selected':''}>Last year</option></select></label></div><div class="scroll-x"><table class="tbl"><thead><tr><th>Patient</th><th>Type</th><th>Provider</th><th>Status</th></tr></thead><tbody>${L2.map(a=>`<tr><td>${can('clin.view')?`<a href="#/adm/${a.id}">${esc(nm(P(a.p)))}</a>`:'<span class="muted">Hidden, need-to-know</span>'}</td><td>${phase(a)==='postnatal'?'Postnatal':'Antenatal'}</td><td>${DOCS[a.doc].n}</td><td>${a.st==='open'?'Open':'Complete'}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">None match.</td></tr>'}</tbody></table></div>`,L2.length+' admissions')}
 else if(t==='pay'){const paid=S.inv.filter(i=>i.paid>0).map(i=>{const a=i.a&&AP(i.a);return{doc:a?a.doc:'nair',m:i.paid}});
  body=pnl('xr-m','One terminal, many merchants, simulated',`<p class="muted">One EFTPOS terminal can settle to a different bank account for each provider. Terminal link is not connected in this mockup.</p><div class="scroll-x"><table class="tbl"><thead><tr><th>Provider</th><th>Settles to</th><th>Taken, from invoices</th></tr></thead><tbody>${Object.keys(DOCS).map((k,i)=>`<tr><td>${DOCS[k].n}</td><td>Merchant account ${i+1}, ending 000${i+1} (demo)</td><td class="num">${money(paid.filter(x=>x.doc===k).reduce((s,x)=>s+x.m,0))}</td></tr>`).join('')}</tbody></table></div>`,'simulated')}
 else body=pnl('xr-s','Scheduled reports',`<ul class="mlist"><li><span><label for="xrt"><b>Weekly financial summary</b></label><br><span class="muted">Emailed to owners. Last run: ${x.sched.last}</span></span><span><input type="checkbox" id="xrt" ${x.sched.rpt?'checked':''} data-on="xRTog" style="width:22px;height:22px;accent-color:var(--brand)"></span></li></ul><div class="row-actions"><button class="btn" type="button" data-act="xRSend">Send now (simulated)</button></div>`,'');
 return `<div class="vh"><h1>Reports</h1></div><div class="tabs" role="tablist">${tabs.map(([k,l])=>`<a role="tab" href="#/rep/${k}" aria-selected="${t===k}">${l}</a>`).join('')}</div>${body}`};

// ---- telehealth ----
ACT.xTele=el=>{if(!UI.xtc){toast('Tick the consent box first.');return}const a=AP(el.dataset.id);openModal({title:'Video visit, '+nm(P(a.p)),size:'lg',body:`<div class="notice"><b>Simulated.</b> No camera, microphone or network is used in this mockup.</div><div style="background:var(--text);color:var(--surface);border-radius:var(--r);min-height:12rem;display:grid;place-items:center;padding:1rem">Video would appear here</div>`,foot:'<button class="btn" data-act="close">End visit</button>'});audit('Video visit opened (simulated)',nm(P(a.p)))};
ON.xtc=el=>{UI.xtc=el.checked;R()};
VIEWS.tele=()=>{const L2=S.appts.filter(a=>a.ty==='tele'&&a.st!=='cancelled').sort((a,b)=>a.d-b.d||a.t-b.t);
 return `<div class="vh"><h1>Telehealth</h1></div><p class="muted">Virtual consultations are booked like any appointment and keep the same record.</p>${pnl('xt-l','Telehealth appointments',`<ul class="mlist">${L2.map(a=>`<li><span><b>${esc(nm(P(a.p)))}</b><br><span class="muted">${dayFull(a.d)} ${hm(a.t)}, ${esc(DOCS[a.doc].n)}</span></span><span><button class="btn sm" type="button" data-act="xTele" data-id="${a.id}">Start video visit (simulated)</button><button class="btn sm" type="button" data-act="start" data-id="${a.id}">Open consultation</button></span></li>`).join('')||'<li class="muted">None booked.</li>'}</ul><div class="fld"><label><input type="checkbox" data-on="xtc" ${UI.xtc?'checked':''}> The patient agreed to a video visit.</label></div>`,L2.length+' booked')}`};
// ---- doctor-first dashboard (shared by all four variants; Doctor role lands here) ----
UI.md=UI.md||'nair';UI.doc=UI.md;UI.cdoc.hendry=false;S.docId=S.docId||UI.md;
const mine=()=>S.appts.filter(a=>a.d===0&&a.doc===UI.md&&a.st!=='cancelled').sort((a,b)=>a.t-b.t||a.id-b.id);
const dkOpen=a=>['booked','online','arrived'].includes(a.st);
const dkGo=a=>`<button class="btn pri sm" type="button" data-act="start" data-id="${a.id}">${a.st==='with'?'Continue consult':'Start consult'}</button>`;
const dkAl=p=>(p.al.length?chip('bad','Allergy: '+p.al.join(', ')+' (keyword demo)'):'')+p.flags.map(f=>chip('info',f)).join('');
const dkTag=V.pms||V.noWrap?'h1':'p';
ACT.dkDoc=el=>{UI.md=el.dataset.id;UI.doc=UI.md;S.docId=UI.md;persist();R()};
function dkHead(){const L=mine(),wt=L.filter(a=>a.st==='arrived').length,rv=S.results.filter(r=>r.st!=='reviewed').length,ns=S.notes.filter(n=>n.st==='draft').length,um=S.msgs.filter(m=>m.dir==='in'&&(m.st==='unread'||m.st==='fail')).length,hr=Math.floor(now()/60);
 return `<div class="dk-top"><div><${dkTag} class="dk-hi">Good ${hr<12?'morning':hr<17?'afternoon':'evening'}, ${DOCS[UI.md].n}</${dkTag}><p class="dk-sub">${dayFull(0)}, ${L.length} patients today, ${wt} waiting for you.</p></div><span class="seg" role="group" aria-label="Doctor shown (demo)">${Object.keys(DOCS).map(k=>`<button type="button" aria-pressed="${UI.md===k}" data-act="dkDoc" data-id="${k}">${DOCS[k].s}</button>`).join('')}</span></div>
 <div class="dk-kp" role="group" aria-label="Your day at a glance"><a href="#/wait" class="${wt?'w':''}"><b class="num">${wt}</b><span>Waiting for you</span></a><a href="#/res" class="${rv?'w':''}"><b class="num">${rv}</b><span>Results to review</span></a><a href="#/pts" class="${ns?'w':''}"><b class="num">${ns}</b><span>Notes to sign</span></a><a href="#/inbox"><b class="num">${um}</b><span>Messages to read</span></a><a href="#/rec"><b class="num">${S.recalls.filter(r=>r.st==='due').length}</b><span>Recalls due</span></a></div>`}
function dkNow(){const L=mine(),w=L.find(a=>a.st==='with'),nx=w||L.filter(a=>a.st==='arrived').sort((a,b)=>a.arr-b.arr)[0]||L.find(dkOpen);
 if(!nx)return pnl('dk-n','Next patient','<p class="muted">No more patients today.</p>','');
 const p=P(nx.p),st=nx.st==='arrived'?Math.max(0,now()-nx.arr)+' min in the waiting room':nx.st==='with'?'In consultation':'Booked for '+hm(nx.t);
 return pnl('dk-n',w?'In consultation now':'Next patient',`<div class="dk-now"><div><b class="dk-nm">${esc(nm(p))}</b><span class="muted">${age(p.dob)} years, ${TYPES[nx.ty][0]}${nx.why?', '+esc(nx.why):''}</span><div class="ctx">${chip(nx.st==='with'?'info':nx.st==='arrived'?'warn':'neu',st)}${dkAl(p)}</div></div><div class="row-actions">${dkGo(nx)}<button class="btn sm" type="button" data-act="openPt" data-id="${p.id}">Open record</button></div></div>`,hm(nx.t))}
const dkDay=()=>pnl('dk-d','My day',`<ul class="dk-l">${mine().map(a=>`<li class="${a.st==='with'?'on':''}"><span class="t">${hm(a.t)}</span><span class="n"><b>${esc(nm(P(a.p)))}</b><span>${TYPES[a.ty][0]}, ${a.dur} min${a.why?', '+esc(a.why):''}</span></span><span class="st">${scChip(a)}</span><span class="act">${dkOpen(a)||a.st==='with'?dkGo(a):''}<button class="btn sm" type="button" data-act="openPt" data-id="${a.p}">Record</button></span></li>`).join('')||'<li class="empty">Nothing booked today.</li>'}</ul><div class="row-actions"><a class="btn sm" href="#/book">Open my calendar</a></div>`,mine().length+' today');
const dkWait=()=>{const w=mine().filter(a=>a.st==='arrived').sort((a,b)=>a.arr-b.arr);return pnl('dk-w','Waiting for me',w.map(a=>`<div class="q"><span><b>${esc(nm(P(a.p)))}</b><br><span class="muted">${Math.max(0,now()-a.arr)} min waiting, ${esc(a.why||TYPES[a.ty][0])}</span></span>${dkGo(a)}</div>`).join('')||'<p class="muted">Nobody is waiting.</p>',w.length+' waiting')};
const dkRes=()=>can('results')?pnl('dk-r','Results to review',resRows(S.results.filter(r=>r.st!=='reviewed')),S.results.filter(r=>r.st!=='reviewed').length+' to review'):pnl('dk-r','Results to review',restricted('Results'),'');
const dkWork=()=>{const dn=S.notes.filter(n=>n.st==='draft'&&n.a&&AP(n.a)),fr=S.ref.filter(r=>r.st==='fail');return pnl('dk-k','To finish',dn.map(n=>`<div class="q"><span><b>${esc(nm(P(n.p)))}</b>, progress note${n.ai&&n.ai.st==='pending'?' '+chip('ai','AI draft, needs clinician review'):''}</span><a class="btn sm" href="#/${crt(AP(n.a))}">Continue note</a></div>`).join('')+fr.map(r=>`<div class="q"><span><b>${esc(nm(P(r.p)))}</b>, referral ${chip('bad','Not sent (simulated)')}</span><a class="btn sm" href="#/pts/${r.p}">Open</a></div>`).join('')||'<p class="muted">Nothing waiting.</p>',dn.length+fr.length+'')};
const dkMsg=()=>{const m=S.msgs.filter(x=>x.dir==='in'&&(x.st==='unread'||x.st==='fail'));return pnl('dk-m','Messages',m.map(x=>`<div class="q"><span><b>${esc(x.from)}</b><br><span class="muted">${esc(x.sub)}</span></span><a class="btn sm" href="#/inbox">Open</a></div>`).join('')||'<p class="muted">No unread messages.</p>',m.length+' unread')};
const dkTasks=()=>taskHome();
const dkRec=()=>pnl('dk-c','Recalls due',recRows(S.recalls.filter(r=>r.st==='due'))||'<p class="muted">None due.</p>','');
const dkTele=()=>{const t=S.appts.filter(a=>a.d===0&&a.ty==='tele'&&a.doc===UI.md);return pnl('dk-t','Telehealth today',t.map(a=>`<div class="q"><span><b>${esc(nm(P(a.p)))}</b>, ${hm(a.t)}</span>${dkGo(a)}</div>`).join('')||'<p class="muted">No telehealth visits today.</p><div class="row-actions"><a class="btn sm" href="#/tele">Open telehealth</a></div>',t.length+'')};
const dkLists=()=>{if(typeof X!=='function')return '';const x=X(),o=x.adm.filter(a=>a.st==='open');return pnl('dk-a','Admissions and lists',fnRow('Obstetric, open',o.filter(a=>a.kind==='preg').length,6,'')+fnRow('Procedures booked',o.filter(a=>a.kind==='surg').length,6,'info')+fnRow('Consent missing',o.filter(a=>a.kind==='surg'&&!a.consent).length,6,'warn')+`<div class="row-actions"><a class="btn sm" href="#/adm">Admissions</a><a class="btn sm" href="#/lists">Theatre and delivery lists</a><a class="btn sm" href="#/letters">Letters</a></div>`,'')};
const DKL={bp:{cls:'c2',cols:[[dkNow,dkDay],[dkWait,dkRes,dkWork,dkTasks,dkRec]]},
 halaxy:{cls:'c2',top:[dkNow],cols:[[dkDay,dkMsg],[dkWork,dkRes,dkTasks,dkRec]]},
 medirecords:{cls:'c3',top:[dkNow],cols:[[dkRes,dkMsg],[dkDay],[dkWait,dkWork,dkTasks,dkRec]]},
 xestro:{cls:'c2',top:[dkNow],cols:[[dkLists,dkDay,dkTele],[dkRes,dkWork,dkTasks,dkMsg]]}};
function docHome(){const l=DKL[V.id]||DKL.bp;return `<div class="dk dk-${V.id} ${l.cls}">${dkHead()}${(l.top||[]).map(f=>f()).join('')}<div class="dk-g">${l.cols.map(c=>`<div class="col">${c.map(f=>f()).join('')}</div>`).join('')}</div></div>`}
const homeOther=V.home;V.home=()=>S.role==='gp'?docHome():homeOther();
// boot
$('#palIn').oninput=e=>palette(e.target.value);$('#palIn').onkeydown=e=>{if(e.key==='Enter'&&PAL[0]){$('#pal').close();PAL[0].f()}};
document.getElementById('pal').addEventListener('click',e=>{if(e.target.id==='pal')e.target.close()});
document.getElementById('dlg').addEventListener('click',e=>{if(e.target.id==='dlg')closeModal()});
R();

})();
</script></body></html>
