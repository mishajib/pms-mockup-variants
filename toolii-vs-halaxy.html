:root{
--bg:oklch(0.972 0.008 85);--surface:oklch(1 0.002 85);--surface-2:oklch(0.948 0.01 85);--hover:oklch(0.935 0.035 298 / .55);--line:oklch(0.895 0.012 85);--line-strong:oklch(0.6 0.02 285);
--text:oklch(0.22 0.025 290);--muted:oklch(0.45 0.025 285);--brand:oklch(0.48 0.17 295);--brand-hover:oklch(0.43 0.17 295);--on-brand:oklch(1 0.004 295);--link:oklch(0.4 0.15 295);--focus:oklch(0.5 0.17 295);
--nav-bg:oklch(0.953 0.012 85);--nav-fg:oklch(0.3 0.03 290);--nav-hi:oklch(0.32 0.13 295);--nav-active:oklch(1 0.002 85);--nav-focus:oklch(0.48 0.17 295);--nav-line:oklch(0.89 0.014 85);
--sel:oklch(0.935 0.035 298);--sel-line:oklch(0.48 0.17 295);--warn-solid:oklch(0.48 0.17 295);--warn-solid-fg:oklch(1 0.004 295);--closed:oklch(0.945 0.008 85);
--demo-bg:oklch(0.22 0.03 290);--demo-fg:oklch(0.95 0.02 298);--toast-bg:oklch(0.22 0.025 290);--toast-fg:oklch(1 0 0);--ai-bg:oklch(0.96 0.025 298);--ai-fg:oklch(0.32 0.13 295);--ai-line:oklch(0.62 0.13 295);
--r:.875rem;--rc:.625rem;--navw:16rem;--ease-out:cubic-bezier(.16,1,.3,1);
--font:'Instrument Sans',ui-sans-serif,system-ui,sans-serif;--head:'Schibsted Grotesk','Instrument Sans',ui-sans-serif,system-ui,sans-serif;--headw:600;--mono:'DM Mono',ui-monospace,'SF Mono',Menlo,monospace}
/* hallmark: custom app-mockup direction, all colour and type through :root tokens */
*{box-sizing:border-box}html,body{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,ol,dl{margin:0}ul,ol{padding:0;list-style:none}h3{font-size:14px;margin:10px 0 2px}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:var(--link)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}.muted{color:var(--muted)}
.demo{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:6px 16px;background:var(--demo-bg);color:var(--demo-fg);font-size:13px}
.demo a{color:inherit}.demo .sp{flex:1}.demo label{display:flex;gap:6px;align-items:center}
.demo select{background:transparent;color:inherit;border:1px solid currentColor;border-radius:6px;min-height:28px}.demo select option{color:#000}
.demo button{background:none;color:inherit;border:1px solid currentColor;border-radius:6px;padding:2px 10px;font-size:13px;min-height:28px}
.app{display:grid;grid-template-columns:var(--navw,220px) minmax(0,1fr);min-height:calc(100vh - 38px)}
.navb{background:var(--nav-bg);color:var(--nav-fg);padding:16px 10px;position:sticky;top:0;align-self:start;height:100vh;overflow:auto}
.navb .logo{font:700 20px var(--head);color:var(--nav-hi);padding:2px 10px 14px}.navb .logo small{display:block;font:400 12px var(--font);color:var(--nav-fg)}
.navb a,.navb .more{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--nav-fg);text-decoration:none;font-size:14px;min-height:42px;position:relative;background:none;border:0;width:100%;text-align:left}
.navb a:hover,.navb .more:hover{background:var(--nav-active);color:var(--nav-hi)}
.navb a[aria-current]{background:var(--nav-active);color:var(--nav-hi);font-weight:600;box-shadow:inset 3px 0 0 var(--nav-focus)}
.navb :focus-visible{outline-color:var(--nav-focus)}
.navb .more{display:none}.navb .foot{margin:16px 10px 0;padding-top:10px;border-top:1px solid var(--nav-line);font-size:12px}
.nb{margin-left:auto;background:var(--warn-solid);color:var(--warn-solid-fg);border-radius:99px;font-size:12px;font-weight:700;padding:0 7px;line-height:18px}
.kbd{font-family:var(--mono);font-size:12px;padding:0 6px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:5px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.main{padding:16px 20px 48px;min-width:0}
.top{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.cmd{flex:1;display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 14px;background:var(--surface);border:1px solid var(--line-strong);border-radius:99px;text-align:left;color:var(--muted)}.cmd .kbd{margin-left:auto}
.vh{display:flex;align-items:center;gap:12px;margin:4px 0 12px;flex-wrap:wrap}.vh h1{font:var(--headw,700) 22px var(--head);flex:1}.back{color:inherit;text-decoration:none}.back::before{content:"\2039  "}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0;margin-bottom:14px}.panel h2{font-size:15px}
.ph{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:8px 14px;background:none;border:0;text-align:left;font-weight:600;border-radius:var(--r)}.ph:hover{background:var(--hover)}
.ph svg{flex:none;transition:transform .15s ease-out;color:var(--muted)}.ph[aria-expanded=false] svg{transform:rotate(-90deg)}
.pt{font-family:var(--head)}.pm{margin-left:auto;font-weight:400;font-size:13px;color:var(--muted);text-align:right}
.pb{padding:2px 14px 14px}.pb[hidden]{display:none}
.chip{display:inline-flex;align-items:center;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600;line-height:20px;border:1px solid transparent;margin:2px 4px 2px 0}
.c-ok{background:var(--ok-bg);color:var(--ok-fg)}.c-warn{background:var(--warn-bg);color:var(--warn-fg)}.c-bad{background:var(--bad-bg);color:var(--bad-fg)}.c-info{background:var(--info-bg);color:var(--info-fg)}.c-neu{background:var(--neu-bg);color:var(--neu-fg)}
.c-ai{background:var(--ai-bg);color:var(--ai-fg);border-color:var(--ai-line);border-style:dashed}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:4px 14px;border-radius:var(--rc);border:1px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:14px;text-decoration:none;color:var(--text);margin:2px 4px 2px 0}
.btn:hover{background:var(--hover)}.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}.btn.pri:hover{background:var(--brand-hover)}
.btn.bad{background:var(--danger);border-color:var(--danger);color:#fff}.btn.sm{min-height:34px;padding:2px 10px;font-size:13px}.btn[disabled]{opacity:.55;cursor:not-allowed}
.row-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.empty{padding:16px;color:var(--muted)}
.fld{margin:0 0 12px}.fld label{display:block;font-weight:600;font-size:14px;margin-bottom:4px}.fld .req{font-weight:400;color:var(--muted)}
.fld input:not([type=checkbox]),.fld select,.fld textarea{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line-strong);border-radius:var(--rc);background:var(--surface);font-size:16px}
.fld [aria-invalid=true]{border-color:#B91C1C;border-width:2px}.err{color:#991B1B;font-size:13px;margin-top:4px;font-weight:600}.hint{font-size:13px;color:var(--muted);margin-top:4px}
.fld.chk label,label.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400}.fld input[type=checkbox],label.chk input,.ai input[type=checkbox]{width:22px;height:22px;margin:0;accent-color:var(--brand);flex:none}
.notice{border:1px solid var(--line-strong);border-left:4px solid var(--brand);border-radius:var(--rc);padding:10px 14px;margin:8px 0;background:var(--surface-2)}.notice.bad{border-left-color:#B91C1C}.notice.info{border-left-color:#1E40AF}
dialog{border:1px solid var(--line-strong);border-radius:16px;padding:0;width:min(580px,calc(100vw - 24px));max-height:88vh;background:var(--surface);color:var(--text);overflow:auto}
dialog.sm{width:min(400px,calc(100vw - 24px))}dialog.lg{width:min(780px,calc(100vw - 24px))}dialog::backdrop{background:rgba(10,14,22,.55)}
dialog header{display:flex;align-items:center;padding:14px 18px 6px}dialog h2{flex:1;font:var(--headw,700) 18px var(--head)}.x{border:0;background:none;font-size:26px;line-height:1;min-width:44px;min-height:44px}
.mb{padding:6px 18px 10px}dialog footer{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:10px 18px 16px;position:sticky;bottom:0;background:var(--surface)}

 ['erx','eRx and NPDS',S.rx.length?w(S.rx,x=>x.st):'off',S.rx.length+' scripts, '+S.rx.filter(x=>x.st!=='ack').length+' not yet retrieved (simulated).','/pts'],

 return `<div class="chead"><div class="ct1"><h1>${rng}</h1><p>${sub}. Point at a time and click to book it.</p></div><div class="cctl"><button class="btn sm" type="button" data-act="calToday">Today</button><span class="btn-group"><button class="btn icon" type="button" data-act="calNav" data-n="-1" aria-label="Previous" ${(v==='month'?UI.m===0:d===0)?'disabled':''}>&lsaquo;</button><button class="btn icon" type="button" data-act="calNav" data-n="1" aria-label="Next" ${(v==='month'?UI.m>=3:d>=53)?'disabled':''}>&rsaquo;</button></span><input class="cdin" type="date" id="cdin" value="${isoD(d)}" min="${isoD(0)}" max="${isoD(59)}" data-on="cdate" aria-label="Go to date"><span class="seg" role="group" aria-label="View">${[['day','Day'],['week','Week'],['month','Month'],['list','List']].map(([k,l])=>`<button type="button" aria-pressed="${v===k}" data-act="calView" data-id="${k}">${l}</button>`).join('')}</span>${v==='week'||v==='month'?`<select class="cdsel" id="cprac" data-on="cprac" aria-label="Practitioner">${Object.keys(DOCS).map(k=>`<option value="${k}"${docs[0]===k?' selected':''}>${DOCS[k].n}</option>`).join('')}</select>`:''}<span class="btn-group zoom" role="group" aria-label="Row height"><button class="btn icon" type="button" data-act="calZoom" data-n="-1" aria-label="Zoom out" ${UI.zoom<=ZS[0]?'disabled':''}>&minus;</button><button class="btn icon" type="button" data-act="calZoom" data-n="1" aria-label="Zoom in" ${UI.zoom>=ZS[3]?'disabled':''}>+</button></span><button class="btn icon full-t" type="button" data-act="calFull" aria-pressed="${UI.full}" aria-label="${UI.full?'Exit full screen':'Full screen'}" title="${UI.full?'Exit full screen':'Full screen'}"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="${UI.full?'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5':'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5'}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button class="btn" type="button" data-act="calNext">Next available</button><button class="btn pri" type="button" data-act="newAppt">New appointment <span class="kbd">F3</span></button></div></div>

function calPage(){if(V.calPage)return V.calPage();if(V.pms)return calPagePms();const d=UI.d,v=UI.cv;

 ${v!=='list'?`<div class="filters" role="group" aria-label="Doctors shown">${Object.keys(DOCS).map(k=>`<button class="fl" type="button" aria-pressed="${!!cd()[k]}" data-act="calDoc" data-id="${k}">${DOCS[k].n}</button>`).join('')}</div>`:''}

if(V.cal){VIEWS.book=calPage;VIEWS.today=()=>(V.pms||V.noWrap)?V.home():`<div class="vh"><h1>${V.title||'Today'}</h1><a class="btn pri" href="#/book">Open calendar</a></div>${V.home()}`}

ACT.calClose=()=>{UI.sel=null;R()};ACT.calNav=el=>{UI.enter=1;const n=+el.dataset.n;if(UI.cv==='month')UI.m=Math.max(0,Math.min(3,UI.m+n));else UI.d=Math.max(0,Math.min(59,UI.d+n*(UI.cv==='week'?7:1)));UI.hl=null;R()};ACT.calToday=()=>{UI.enter=1;UI.d=0;UI.m=0;UI.hl=null;R()};
ACT.calView=el=>{UI.enter=1;UI.cv=el.dataset.id;R()};ACT.calDoc=el=>{UI.enter=1;const k=el.dataset.id;if(cd()[k]&&activeDocs().length===1){toast('Keep at least one doctor shown.');return}cd()[k]=!cd()[k];R()};

ACT.calNext=()=>{UI.enter=1;const docs=activeDocs().length?activeDocs():Object.keys(DOCS);for(let d=0;d<=6;d++)for(let m=Math.max(CS,d===0?Math.ceil((now()+5)/15)*15:CS);m+20<=CE;m+=15)for(const k of docs)if(!clash(k,d,m,20)){UI.d=d;UI.cv=innerWidth>=700?'week':'day';UI.full=false;UI.hl={doc:k,d,t:m};cd()[k]=true;R();toast('Next available: '+DOCS[k].n+', '+dayName(d)+' '+hm(m)+'. Click the highlighted slot to book.');setTimeout(()=>{const h=$('.cs.hl');h&&h.scrollIntoView({block:'center'})},30);return}toast('No free slot in the next week.')};
function moveAppt(id,doc,t,d){if(!need('appt','Moving an appointment'))return;const a=AP(id);if(!['booked','online'].includes(a.st)){toast('Only booked appointments can be moved.');return}
 if(d===0&&t<now()){toast('That time has already passed.');return}if(t+a.dur>CE){toast('That would run past 17:00.');return}
 const c=clash(doc,d,t,a.dur,a.id);if(c){toast('That slot is taken by '+nm(P(c.p))+'. Use Reschedule if you want to double-book.','bad');return}
 Object.assign(a,{doc,d,t});UI.sel=a.id;UI.flash=a.id;UI.drIn=1;audit('Moved appointment',nm(P(a.p))+' to '+hm(t));persist();R();toast('Moved to '+DOCS[doc].n+', '+hm(t)+'.')}
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.cap[draggable=true]');if(c){e.dataTransfer.setData('text/plain',c.dataset.id);e.dataTransfer.effectAllowed='move'}});

addEventListener('keydown',e=>{if(e.key!=='Escape'||$('#dlg').open||$('#pal').open||rt().v!=='book')return;if(UI.sel){UI.sel=null;R()}else if(UI.full){UI.full=false;R()}});

ACT.reqOk=el=>{if(!need('appt'))return;const r=S.req.find(x=>x.id==el.dataset.id);r.st='ok';S.appts.push({id:++S.next,p:r.p,doc:r.doc,d:1,t:840,dur:20,ty:'std',st:'online',why:'Booked online'});audit('Confirmed online booking',nm(P(r.p)));persist();R();toast('Confirmed. Confirmation SMS simulated, nothing sent.')};

function hxHome(){const nowM=now(),hr=Math.floor(nowM/60),first=S.role==='gp'?'Priya':S.role==='reception'?'Alex':'Sam';
 const day=S.appts.filter(a=>a.d===0&&a.st!=='cancelled').sort((a,b)=>a.t-b.t),live=day.filter(a=>a.st!=='dna');
 const open=a=>['booked','online','arrived'].includes(a.st),next=live.find(a=>open(a)&&a.t>=nowM-15)||live.find(open);
 const waiting=day.filter(a=>a.st==='arrived').length,rev=S.results.filter(r=>r.st!=='reviewed').length,sentence=`${live.length} appointments, ${waiting} waiting${can('results')?', '+rev+' results to review':''}`;
 const owing=S.pts.reduce((s,p)=>s+bal(p.id),0),drafts=S.notes.filter(n=>n.st==='draft').length,toIssue=S.inv.filter(i=>i.st==='draft').length;
 let marked=false;const rows=day.map(a=>{let m='';if(!marked&&a.t>=nowM){marked=true;m=`<li class="nowm" aria-label="Now ${hm(nowM)}"><span class="tt mono">${hm(nowM)}</span><span class="nowd"></span><span class="nowl2">Now</span></li>`}
  const p=P(a.p),dim=['dna'].includes(a.st)?' dim':'';
  return m+`<li class="${dim}"><span class="tt mono">${hm(a.t)}</span><span class="dotx s-${a.st}" aria-hidden="true"></span><div class="tc"><a class="tn" href="#/pts/${a.p}" data-act="openPt" data-id="${a.p}" data-ctx="${a.id}">${esc(nm(p))}</a> ${scChip(a)}<p>${TYPES[a.ty][0]}, ${a.dur} min${a.why?', '+esc(a.why):''}, ${DOCS[a.doc].s}</p>${open(a)||a.st==='with'?`<div class="row-actions">${a.st==='booked'||a.st==='online'?`<button class="btn sm" type="button" data-act="arrive" data-id="${a.id}">Arrive</button>`:''}${open(a)?`<button class="btn pri sm" type="button" data-act="start" data-id="${a.id}">Start visit</button>`:`<button class="btn pri sm" type="button" data-act="open" data-id="${a.id}">Back to consult</button>`}</div>`:''}</div></li>`}).join('')+(marked?'':`<li class="nowm"><span class="tt mono">${hm(nowM)}</span><span class="nowd"></span><span class="nowl2">Now</span></li>`);

 return `<div class="dh rise" style="--i:0"><div><h1>Good ${hr<12?'morning':hr<17?'afternoon':'evening'}, ${first}</h1><p>${dayFull(0)}, <span class="num">${hm(nowM)}</span>, ${sentence}</p></div><div class="row-actions" style="margin:0"><a class="btn" href="#/book">Open calendar</a><button class="btn pri" type="button" data-act="newAppt">New appointment</button></div></div>
